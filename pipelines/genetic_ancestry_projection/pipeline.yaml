schema_version: "1.0"
id: genetic-ancestry-projection
name: Genetic ancestry projection (1KGP)
version: dev
description: >-
  Project cohort genotypes onto a fixed 1KGP reference PC space and report
  probability-gated genetic-similarity groups with an overlay plot.
engine: nextflow
engine_version: 26.04.6
workflow_type: NFL
workflow_type_version: DSL2
entrypoint: main.nf
tags: [nextflow, ancestry, 1000-genomes, development, pca]
estimate: "5-20 CPU·h for 500-2000 samples"
token_estimate: 10
execution:
  preferred_location: alor
  resource_profile: standard
inputs:
  - role: genotypes
    parameter: genotype_uri
    required: true
  - role: bgen_sample
    parameter: bgen_sample_uri
    required: false
parameters:
  - name: cohort_id
    type: string
    required: true
    label: Cohort identifier
  - name: genotype_format
    type: enum
    required: true
    default: vcf
    values: [vcf, bgen]
    label: Genotype format
  - name: reference_release
    type: string
    required: true
    default: 1kgp-grch38
    label: Reference release
outputs:
  - {name: ancestry, path: "results/*.ancestry.tsv", media_type: text/tab-separated-values}
  - {name: pca_overlay, path: "results/*.pca-overlay.html", media_type: text/html}
  - {name: projection_metrics, path: "results/*.projection-metrics.tsv", media_type: text/tab-separated-values}
  - {name: provenance, path: "results/*.provenance.tsv", media_type: text/tab-separated-values}
