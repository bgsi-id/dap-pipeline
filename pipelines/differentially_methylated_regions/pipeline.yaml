schema_version: "1.0"
id: differentially-methylated-regions
name: Differentially methylated region analysis
version: 0.1.0
description: >-
  Compare two governed cohort packs using per-sample modkit bedMethyl assets.
  Produce a primary all-read analysis plus HP1, HP2 and ungrouped sensitivity
  analyses using DSS beta-binomial differential methylation tests.
engine: nextflow
engine_version: 26.04.6
workflow_type: NFL
workflow_type_version: DSL2
entrypoint: main.nf
tags: [nextflow, nanopore, methylation, bedmethyl, dmr, development, dss, bsseq]
estimate: "Input-dependent; bedMethyl normalization scales horizontally by sample"
token_estimate: 20
execution:
  preferred_location: alor
  resource_profile: standard
data_input:
  contract: dap-pack-manifest/v2
  accepted_pack_kinds: [cohort]
  named_packs: [control, patient]
  required_assets:
    - role: bedmethyl
      scope: sample
      required: true
parameters:
  - name: cohort_id
    type: string
    required: true
    label: Analysis identifier
  - name: mod_code
    type: string
    required: false
    default: m
    label: Modified-base code
  - name: genomic_region
    type: string
    required: false
    default: ""
    label: Genomic region (contig:start-end)
    help: Optional 1-based inclusive interval, for example chr22:20000000-21000000.
  - name: min_coverage
    type: integer
    required: false
    default: 5
    minimum: 1
    label: Minimum valid coverage per CpG and sample
  - name: min_sample_fraction
    type: number
    required: false
    default: 0.8
    minimum: 0.01
    maximum: 1
    label: Minimum covered fraction in each cohort
  - name: min_samples_per_cohort
    type: integer
    required: false
    default: 3
    minimum: 3
    label: Minimum samples in each cohort
  - name: dss_p_threshold
    type: number
    required: false
    default: 0.001
    minimum: 0.000000001
    maximum: 0.999999999
    label: DSS DMR CpG p-value threshold
  - name: dss_delta
    type: number
    required: false
    default: 0.05
    minimum: 0
    maximum: 0.999999999
    label: Minimum absolute methylation difference
  - name: dss_min_length
    type: integer
    required: false
    default: 50
    minimum: 1
    label: Minimum DMR length (bp)
  - name: dss_min_cpgs
    type: integer
    required: false
    default: 3
    minimum: 2
    label: Minimum CpGs per DMR
  - name: dss_merge_distance
    type: integer
    required: false
    default: 50
    minimum: 0
    label: Maximum distance for merging nearby DMRs (bp)
  - name: dss_significant_fraction
    type: number
    required: false
    default: 0.5
    minimum: 0.01
    maximum: 1
    label: Minimum fraction of significant CpGs per DMR
  - name: dss_equal_dispersion
    type: boolean
    required: false
    default: true
    label: Assume equal dispersion between cohorts
  - name: dss_smoothing
    type: boolean
    required: false
    default: false
    label: Smooth methylation levels before DSS testing
outputs:
  - {name: combined_dmrs, path: "results/combined/dmr-results.tsv", media_type: text/tab-separated-values}
  - {name: combined_profile, path: "results/combined/top-dmr-profile.png", media_type: image/png}
  - {name: combined_dss_qc, path: "results/combined/top-dmr-dss.png", media_type: image/png}
  - {name: hp1_dmrs, path: "results/hp1/dmr-results.tsv", media_type: text/tab-separated-values}
  - {name: hp1_profile, path: "results/hp1/top-dmr-profile.png", media_type: image/png}
  - {name: hp2_dmrs, path: "results/hp2/dmr-results.tsv", media_type: text/tab-separated-values}
  - {name: hp2_profile, path: "results/hp2/top-dmr-profile.png", media_type: image/png}
  - {name: ungrouped_dmrs, path: "results/ungrouped/dmr-results.tsv", media_type: text/tab-separated-values}
  - {name: ungrouped_profile, path: "results/ungrouped/top-dmr-profile.png", media_type: image/png}
  - {name: matrix_qc, path: "results/*.matrix-metrics.tsv", media_type: text/tab-separated-values}
