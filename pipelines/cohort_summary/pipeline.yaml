schema_version: "1.0"
id: cohort-summary
name: Cohort summary
version: 0.1.0
description: Create a governed sample-list summary for a selected dataset or cohort pack.
engine: nextflow
engine_version: 26.04.6
workflow_type: NFL
workflow_type_version: DSL2
entrypoint: main.nf
tags: [nextflow, cohort, utility, summary]
estimate: "<1 CPU·h"
token_estimate: 1
execution:
  preferred_location: alor
  resource_profile: standard
inputs:
  - role: vcf
    parameter: vcf_uri
    required: true
  - role: vcf_index
    parameter: vcf_index_uri
    required: true
data_input:
  contract: dap-pack-manifest/v1
  accepted_pack_kinds: [dataset, cohort]
outputs:
  - name: sample_list
    path: cohort-summary.tsv
    media_type: text/tab-separated-values
