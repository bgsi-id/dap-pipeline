schema_version: "1.0"
id: plink-quantitative-gwas
name: GWAS (PLINK2) — quantitative traits
version: dev
description: >-
  Validate a numeric phenotype, perform genotype and sample QC, remove close
  relatives, derive ancestry PCs, and run linear association with PLINK2.
engine: nextflow
engine_version: 26.04.6
workflow_type: NFL
workflow_type_version: DSL2
entrypoint: main.nf
tags: [nextflow, plink2, gwas, quantitative-trait, development, qc]
estimate: "20-80 CPU·h for 500-2000 samples"
token_estimate: 40
execution:
  preferred_location: alor
  resource_profile: standard
inputs:
  - role: genotypes
    parameter: genotype_uri
    required: true
  - role: phenotypes
    parameter: phenotype_uri
    required: true
  - role: bgen_sample
    parameter: bgen_sample_uri
    required: false
parameters:
  - name: cohort_id
    type: string
    required: true
    label: Analysis identifier
  - name: genotype_format
    type: enum
    required: true
    default: vcf
    values: [vcf, bgen]
    label: Genotype format
  - name: phenotype_column
    type: string
    required: true
    label: Quantitative phenotype column
  - name: sample_id_column
    type: string
    required: false
    default: IID
    label: Sample ID column
outputs:
  - {name: summary_statistics, path: "results/*.sumstats.tsv", media_type: text/tab-separated-values}
  - {name: top_hits, path: "results/*.top-hits.tsv", media_type: text/tab-separated-values}
  - {name: principal_components, path: "results/*.pcs.tsv", media_type: text/tab-separated-values}
  - {name: provenance, path: "results/*.provenance.tsv", media_type: text/tab-separated-values}
