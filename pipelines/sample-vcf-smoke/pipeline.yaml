schema_version: "1.0"
id: nextflow-data-smoke
name: Sample VCF input check
version: 0.1.0
description: Resolve one authorised sample and verify its VCF inputs.
engine: nextflow
engine_version: 26.04.6
workflow_type: NFL
workflow_type_version: DSL2
entrypoint: main.nf
tags:
  - nextflow
  - drs
  - sample
  - eks
estimate: "<1 CPU·h"
token_estimate: 1
execution:
  preferred_location: alor
  resource_profile: standard
data_input:
  contract: dap-pack-manifest/v1
  accepted_pack_kinds:
    - dataset
    - cohort
inputs:
  - role: vcf
    parameter: vcf_uri
    checksum_parameter: vcf_sha256
    required: true
  - role: vcf_index
    parameter: vcf_index_uri
    checksum_parameter: vcf_index_sha256
    required: true
outputs:
  - name: summary
    path: "*.summary.txt"
    media_type: text/plain
